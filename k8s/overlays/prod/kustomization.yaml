apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aks-demo-prod

resources:
- ../../base
- configmap.yaml

images:
- name: aks-demo
  newName: craksdemodev.azurecr.io/aks-demo
  newTag: 7cc41b1

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: aks-demo
- patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 3
    - op: replace
      path: /spec/maxReplicas
      value: 20
  target:
    kind: HorizontalPodAutoscaler
    name: aks-demo
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: prod.aksdemo.lenghel.dev
    - op: replace
      path: /spec/tls/0/hosts/0
      value: prod.aksdemo.lenghel.dev
    - op: replace
      path: /spec/tls/0/secretName
      value: prod-aksdemo-lenghel-dev-tls
  target:
    kind: Ingress
    name: aks-demo
