apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aks-demo-dev

resources:
- ../../base
- configmap.yaml

images:
- name: aks-demo
  newName: craksdemodev.azurecr.io/aks-demo
  newTag: 8b7417c

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: aks-demo
