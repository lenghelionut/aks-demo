name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
    - 'app/**'
    - 'k8s/**'
    - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
    - 'app/**'
    - 'k8s/**'

permissions:
  id-token: write
  contents: write

env:
  ACR_REGISTRY: craksdemodev.azurecr.io
  IMAGE_NAME: aks-demo

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      id: tag
      run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }} \
          -t ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
          app/

    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Push to ACR
      run: |
        az acr login --name craksdemodev
        docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
        docker push ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Update Kustomize image tag
      run: |
        cd k8s/overlays/dev
        kustomize edit set image aks-demo=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
        cd ../../overlays/staging
        kustomize edit set image aks-demo=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}

    - name: Commit updated manifests
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/
        git diff --staged --quiet || git commit -m "ci: update image tag to ${{ steps.tag.outputs.TAG }}"
        git push
